name: Recipe build, adapters and installer

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build:check
      - run: npm test

  dsh-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned DSH consumer SDK
        timeout-minutes: 3
        env:
          npm_config_cache: ${{ github.workspace }}/.tmp/dsh-npm-cache
          npm_config_registry: https://registry.npmjs.org
          npm_config_fetch_retries: '1'
          npm_config_fetch_timeout: '20000'
        run: |
          mkdir -p .tmp/dsh-sdk
          cp adapters/dsh/consumer/package{,-lock}.json .tmp/dsh-sdk/
          npm ci --prefix .tmp/dsh-sdk --ignore-scripts --no-audit --no-fund --timing --loglevel=http
      - run: npm run test:dsh
        env:
          DSH_PACKAGE_ROOT: ${{ github.workspace }}/.tmp/dsh-sdk
      - name: Upload npm diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dsh-consumer-npm-logs
          path: .tmp/dsh-npm-cache/_logs/
          if-no-files-found: ignore
