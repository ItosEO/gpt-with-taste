name: Recipe build, adapters and installer

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build:check
      - run: npm test

  dsh-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix .tmp/dsh-sdk --ignore-scripts --no-audit --no-fund @deepseek-ai/dsh@0.1.0-rc.6
      - run: npm run test:dsh
        env:
          DSH_PACKAGE_ROOT: ${{ github.workspace }}/.tmp/dsh-sdk/node_modules/@deepseek-ai/dsh
