<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 344" width="960" height="344">
  <defs>
    <style>
      .lane { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 2.2px; }
      .q { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 13.5px; font-weight: 400; }
      .qmono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 12.5px; font-weight: 400; }
      .hlc { font-weight: 600; fill: #F0886C; }
      .hlt { font-weight: 600; fill: #56D39D; }
      .code { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 11px; }
      .foot { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 11px; fill: #8B949E; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="960" height="344" rx="14" fill="#0D1117"/>
  <rect x="0.75" y="0.75" width="958.5" height="342.5" rx="13" fill="none" stroke="#30363D" stroke-width="1.5"/>

  <!-- Lane headers -->
  <text x="64" y="50" class="lane" fill="#F0886C">BUILTIN DEFAULT</text>
  <text x="508" y="50" class="lane" fill="#56D39D">GPT WITH TASTE</text>
  <rect x="64" y="66" width="832" height="1" fill="#30363D"/>
  <line x1="480" y1="34" x2="480" y2="288" stroke="#30363D" stroke-width="1"/>

  <!-- Left: builtin ending (verbatim) -->
  <text x="64" y="94" class="q" fill="#8B949E"><tspan class="qmono">px-4</tspan><tspan> and </tspan><tspan class="qmono">bg-blue-600</tspan><tspan> are removed; non-conflicting</tspan></text>
  <text x="64" y="114" class="q" fill="#8B949E">defaults stay intact.</text>

  <text x="64" y="146" class="q" fill="#8B949E"><tspan class="hlc">Without a caller's </tspan><tspan class="qmono hlc">className</tspan><tspan class="hlc">,</tspan><tspan> the base</tspan></text>
  <text x="64" y="166" class="q" fill="#8B949E">and variant classes remain unchanged.</text>

  <text x="64" y="198" class="q" fill="#8B949E"><tspan>Overrides </tspan><tspan class="hlc">must target the same modifier</tspan><tspan>:</tspan></text>
  <text x="64" y="218" class="q" fill="#8B949E"><tspan class="qmono">hover:bg-red-500</tspan><tspan> overrides an earlier </tspan><tspan class="qmono">hover:bg-blue-600</tspan><tspan>,</tspan></text>
  <text x="64" y="238" class="q" fill="#8B949E"><tspan class="hlc">not an unprefixed </tspan><tspan class="qmono hlc">bg-blue-600</tspan><tspan class="hlc">.</tspan></text>

  <!-- Right: taste ending (verbatim) -->
  <text x="508" y="94" class="q" fill="#F0F6FC"><tspan>Non-conflicting defaults, </tspan><tspan class="hlt">including </tspan><tspan class="qmono hlt">py-2</tspan><tspan class="hlt"> and</tspan></text>
  <text x="508" y="114" class="q" fill="#F0F6FC"><tspan class="qmono hlt">text-white</tspan><tspan class="hlt">,</tspan><tspan> remain.</tspan></text>

  <text x="508" y="146" class="q" fill="#F0F6FC">Overrides apply within the same modifier context.</text>
  <text x="508" y="166" class="q" fill="#F0F6FC">For example:</text>

  <rect x="508" y="180" width="388" height="96" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <text x="520" y="201" class="code" fill="#E6EDF3">cn('px-4 hover:bg-blue-600', 'px-6 hover:bg-red-500');</text>
  <text x="520" y="220" class="code" fill="#8B949E">// =&gt; 'px-6 hover:bg-red-500'</text>
  <text x="520" y="245" class="code" fill="#E6EDF3">cn('px-4', 'md:px-6');</text>
  <text x="520" y="264" class="code" fill="#8B949E">// =&gt; 'px-4 md:px-6'</text>

  <!-- Footnote: method + fairness, in the one place the excerpt travels alone -->
  <text x="64" y="310" class="foot">Same model (GPT-6.1 Sol, high effort), same user request and starting document on both sides.</text>
  <text x="64" y="326" class="foot">Both documents also keep a custom-utility caveat. Full originals: docs/cases/button-overrides/</text>
</svg>
